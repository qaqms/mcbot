# ---- 构建 JVM：MC 1.21.11 要求 Java 21 ----
# **故意不在这里写 org.gradle.java.home**：那是"换机必然不同"的本机路径，写在仓里会让
# 别的设备直接构建失败（本项目是多设备开发）。请把它放到**用户级**的
#   <GRADLE_USER_HOME>/gradle.properties   （默认 ~/.gradle/gradle.properties）
# 里；用户级文件与仓内文件会合并，且不进版本控制。
# 什么都不设也行——只要 PATH 上的 `java` 是 21（本机 PATH 上是 17，故本机确实设了用户级那份）。
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ---- 代理：**本机网络相关**，换网络环境请按需删改（删掉 systemProp.*Proxy* 即回退直连）----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# ---- 工具链组合（对齐 fabric-example-mod 1.21.11 分支 + meta 最新稳定）----
# loom 用 -remap 变体：1.21.11 属混淆时代，官方示例即为此插件
loom_version=1.17.20
minecraft_version=1.21.11
loader_version=0.19.5
fabric_api_version=0.141.6+1.21.11

# ---- Mod ----
mod_version=0.1.0
maven_group=com.neko.mcbot
archives_base_name=mcbot
