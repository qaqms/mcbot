distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 用**官方源**（而不是本机某个盘上的 zip）：这是一份多设备/多人共用的仓，
# 写死 file:/<某个盘>/... 会让别的机器连构建都起不来。
# 若目标机网络到不了 services.gradle.org，本机改法（只改这一行、别提交）：
#   先手动下 gradle-9.5.1-bin.zip，再写 distributionUrl=file\:/<你放 zip 的绝对路径>
# （Gradle 会用 URL 的 MD5 作为缓存目录名，换了 URL = 换缓存，所以要重新下/重新指）
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
networkTimeout=60000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
